name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The unit tests and the asset scripts are .mts run through
          # --experimental-strip-types, which needs a recent Node.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # Last, because it is the slowest and the three checks above localise a
      # failure far better than a bundler error does.
      - run: npm run build

  backend:
    name: Backend (CPU tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      # Deliberately not backend/requirements.txt: that pulls torch, diffusers
      # and the SAM/TripoSR stack, several GB of wheels for models no runner
      # can execute. These are what the geometry and job-state tests import.
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy scikit-image trimesh fastapi python-multipart usd-core

      # `scripts/isaac-sim/test_pipeline.py` needs none of the four toolchains
      # `pipeline.py` drives. What it pins is the Windows -> WSL path
      # translation and the regexes that turn each stage's stdout into the
      # report -- if one of those stops matching, the report goes quietly blank
      # instead of red, which is the same shape as every other bug this
      # directory has produced.
      #
      # `scripts/isaac-sim/test_navmap.py` needs neither OpenUSD nor Isaac Sim:
      # `navmap` is the map reading and the planner that `check_navmap.py` and
      # `navigate.py` share, so it is the piece where a change quietly makes the
      # checked map and the driven map two different things. numpy and Pillow
      # are all it wants.
      #
      # `usd-core` is in that list on purpose. Without it the seven tests that
      # open an exported stage skipped here, every run, and they are the ones
      # guarding the mistakes this project has actually made -- the floor
      # drifting off zero, the ground plane picking up an offset it must not
      # have, the room height not moving to Z. They need OpenUSD and a world;
      # OpenUSD is a wheel, and the world the suite now builds for itself.
      #
      # `scripts/usd-export/test_export.py` is here because half of it guards
      # the USD exporter against drifting from the TypeScript runtime it
      # re-implements -- and that guard had already gone quiet once. The tests
      # grepped the components for arithmetic that later moved into a shared
      # helper, both greps stopped matching, and the drift they existed to
      # catch then happened underneath them. Nothing noticed, because nothing
      # ran them. Its stage-building tests need OpenUSD and a world, and now
      # have both here; the contract tests need neither and never did.
      #
      # Three suites are not run here, and it is worth being explicit about it:
      #   test_backend.py    -- an environment smoke script, not tests; imports torch.
      #   test_client.py     -- drives a live server on localhost:8000.
      #   test_multiview.py  -- imports multiview_splat, which imports torch.
      # Everything else is pure CPU geometry or job-state logic.
      # `python -m pytest`, not `pytest`: only the module form puts the repo
      # root on sys.path, and every suite imports `backend.*` from there.
      - name: Run CPU test suites
        run: |
          python -m pytest -q \
            backend/test_collider.py \
            backend/test_metric_scale.py \
            backend/test_props.py \
            backend/test_walkable.py \
            backend/test_reconstruction_jobs.py \
            backend/test_unload.py \
            scripts/usd-export/test_export.py \
            scripts/isaac-sim/test_navmap.py \
            scripts/isaac-sim/test_pipeline.py \
            scripts/isaac-sim/test_vlngraph.py
