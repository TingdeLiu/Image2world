# Enough of nav2 to answer one question: can its planner plan on our map?
#
# Deliberately not a full navigation bringup. No localisation, no controller, no
# behaviour tree -- those need a robot and odometry, and none of them say
# anything about whether the map is usable. This is map_server feeding a global
# costmap feeding NavFn, which is the shortest path from "a PNG on disk" to "a
# planner produced a route through it".

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename is passed on the command line -- it is the one thing that
    # changes between worlds.
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # The reconstruction leaves 72.56 m2 of cells with no floor under them,
      # and they arrive here as unknown (-1). Letting a planner route through
      # unknown space would be answering a different, easier question.
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      # Nova Carter's footprint, so the answer is about a robot that exists.
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # map_server latches the map, so the costmap has to ask for it that way
        # or it will sit waiting forever for a message that was already sent.
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true
